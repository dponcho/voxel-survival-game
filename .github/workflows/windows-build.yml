name: Windows portable candidate
on:
  workflow_call:
    inputs:
      cold:
        type: boolean
        default: false
      historical_v1_pilot:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      cold:
        description: Explicit source-to-ZIP rebuild (normally leave disabled)
        type: boolean
        default: false
      historical_v1_pilot:
        description: Explicit historical v1 pilot (not part of the counter-capability task)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  native:
    uses: ./.github/workflows/engine.yml
    with:
      cold: ${{ inputs.cold }}
  export-and-test:
    needs: native
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Download qualified native binaries from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.native.outputs.artifact_id }}
          run-id: ${{ needs.native.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: build/engine-bundle
          merge-multiple: true
      - name: Verify exact native identity and every bundle file
        run: python tools/ci/pipeline.py verify
      - name: Windows packaging regression tests
        run: python -m unittest discover -s tests/integration -v
      - name: Import, export and verify game scenarios
        env:
          CAIRN_HISTORICAL_V1_PILOT: ${{ inputs.historical_v1_pilot }}
        run: python tools/ci/pipeline.py prepare
      - name: One bounded counter capability smoke per matching editor and release
        run: python tools/qa/cpu_cycle_capability.py run
      - name: Verify collision, edits, eviction and all four profiles
        run: python tools/qa/m1_integration.py
      - name: Audit portable distribution and test offline extractions
        env:
          CAIRN_NATIVE_SOURCE: ${{ needs.native.outputs.source }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python tools/ci/pipeline.py package
      - name: Upload portable player ZIP and identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cairn-windows-x86_64-${{ github.sha }}
          path: |
            dist/Cairn-windows-x86_64.zip
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.json
          if-no-files-found: error
          retention-days: 30
      - name: Download published player for independent verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Cairn-windows-x86_64-${{ github.sha }}
          path: build/published-player
      - name: Download native qualification evidence for independent verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Cairn-native-evidence-${{ github.sha }}
          path: build/native-qualification-evidence
      - name: Download the preceding public cloud contract baseline once
        if: ${{ hashFiles('docs/evidence/m1-frontier-travel-contracts-2026-10-09.json') == '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11587222038'
          run-id: '37861287881'
          github-token: ${{ github.token }}
          path: build/previous-evidence
          merge-multiple: true
      - name: Independently verify downloaded candidate and complete saved admission evidence
        run: python tools/qa/mesh_admission_candidate_audit.py
      - name: Upload separate symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cairn-symbols-${{ github.sha }}
          path: dist/Cairn-symbols.zip
          if-no-files-found: error
          retention-days: 30
      - name: Preserve export evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cairn-evidence-${{ github.sha }}
          path: |
            reports/
            build/engine-bundle/manifest.json
            build/dependencies.lock.json
            build/config/
            build/shipping-preflight-raw/
          retention-days: 30
  counter-artifact-recheck:
    needs: [native, export-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Cairn-windows-x86_64-${{ github.sha }}
          path: build/published-player
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Cairn-evidence-${{ github.sha }}
          path: build/downloaded-export-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Cairn-native-evidence-${{ github.sha }}
          path: build/native-qualification-evidence
      - name: Reproduce all saved candidate/counter checks without an engine
        run: python tools/qa/cpu_cycle_saved_recheck.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: Cairn-counter-saved-recheck-${{ github.sha }}
          path: |
            reports/cpu-cycle-downloaded-recheck.json
            reports/counter-candidate-recheck.log
          if-no-files-found: error
          retention-days: 30
  shipping-pilot:
    if: ${{ inputs.historical_v1_pilot }}
    needs: [native, export-and-test]
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Download exact already-qualified native editor
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.native.outputs.artifact_id }}
          run-id: ${{ needs.native.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: build/engine-bundle
          merge-multiple: true
      - name: Download published portable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Cairn-windows-x86_64-${{ github.sha }}
          path: build/published-player
      - name: Download the already-verified editor preflight evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Cairn-evidence-${{ github.sha }}
          path: build/export-source-evidence
      - name: Run finite shipping pilot and reconcile independent saved evidence
        run: python tools/qa/shipping_pilot_ci.py
      - name: Preserve focused pilot evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cairn-shipping-pilot-evidence-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
  saved-artifact-recheck:
    needs: [native, export-and-test, shipping-pilot]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Download published portable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Cairn-windows-x86_64-${{ github.sha }}
          path: build/published-player
      - name: Download complete export evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Cairn-evidence-${{ github.sha }}
          path: build/downloaded-export-evidence
      - name: Download native qualification evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Cairn-native-evidence-${{ github.sha }}
          path: build/native-qualification-evidence
      - name: Download complete focused pilot evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Cairn-shipping-pilot-evidence-${{ github.sha }}
          path: build/downloaded-pilot-evidence
      - name: Reconcile downloaded bytes and all original saved controls without an engine
        run: python tools/qa/shipping_saved_artifact_recheck.py
      - name: Preserve independent artifact recheck
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cairn-saved-artifact-recheck-${{ github.sha }}
          path: |
            reports/saved-artifact-recheck.json
            reports/cloud-main-recheck.log
            reports/cloud-pilot-recheck.log
            build/rechecked-pilot/independent-audit.json
          if-no-files-found: warn
          retention-days: 30
