name: Saved preparation evidence only
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    strategy:
      matrix:
        include:
          - label: windows
            runner: windows-2022
          - label: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '12619403556'
          run-id: '40247195315'
          github-token: ${{ github.token }}
          path: build/published-player
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '12623918109'
          run-id: '40259410841'
          github-token: ${{ github.token }}
          path: build/downloaded-preparation-pilot
          merge-multiple: true
      - name: Replay original evidence; recover only pinned source snapshots
        run: python tools/qa/preparation_demand_saved_recheck.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: Cairn-preparation-replay-${{ matrix.label }}-${{ github.sha }}
          path: reports/preparation-demand-downloaded-recheck.json
          if-no-files-found: error
          retention-days: 30
