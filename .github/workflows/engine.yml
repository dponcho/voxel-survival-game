name: Matching native engine and templates
on:
  workflow_call:
    inputs:
      cold:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Windows packaging regression tests
        run: python -m unittest discover -s tests/integration -v
      - name: Compute complete engine input identity
        id: inputs
        run: python tools/ci/pipeline.py key
      - name: Restore exact verified engine bundle
        if: ${{ !inputs.cold }}
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/engine-bundle
          key: ${{ steps.inputs.outputs.key }}
      - name: Install hash-verified cloud toolchain
        run: python tools/ci/pipeline.py setup
      - name: Build editor, debug and release templates from pinned sources
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: python tools/ci/pipeline.py build
      - name: Verify matching editor and both exported native templates
        run: python tools/ci/pipeline.py prepare
      - name: Cache only successfully verified engine bundles
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/engine-bundle
          key: ${{ steps.inputs.outputs.key }}
      - name: Audit distribution and test offline extractions
        env:
          CAIRN_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: python tools/ci/pipeline.py package
      - name: Upload portable player ZIP and identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cairn-windows-x86_64-${{ github.sha }}
          path: |
            dist/Cairn-windows-x86_64.zip
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload separate symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cairn-symbols-${{ github.sha }}
          path: dist/Cairn-symbols.zip
          if-no-files-found: error
          retention-days: 30
      - name: Preserve command outcomes even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cairn-evidence-${{ github.sha }}
          path: |
            reports/
            build/engine-bundle/manifest.json
            build/dependencies.lock.json
            build/config/
          retention-days: 30
