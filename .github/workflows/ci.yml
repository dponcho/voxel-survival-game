name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Packaging and cache regression tests
        run: python -m unittest discover -s tests/integration -v
      - name: Compile-check owned cloud scripts
        run: python -m compileall -q tools/ci native/sandbox_world/config.py
      - name: Native fixture checks with sanitizers
        run: |
          c++ --version
          c++ -std=c++17 -fsanitize=address,undefined -fno-omit-frame-pointer -g tests/native/test_fixture.cpp -o /tmp/cairn-fixture-test
          /tmp/cairn-fixture-test
      - name: Phase-local operation regression tests with sanitizers
        run: |
          c++ -std=c++17 -fsanitize=address,undefined -fno-omit-frame-pointer -g tests/native/test_operation_metrics.cpp -o /tmp/cairn-operation-test
          /tmp/cairn-operation-test
  windows:
    needs: static
    uses: ./.github/workflows/windows-build.yml
    with:
      cold: false
