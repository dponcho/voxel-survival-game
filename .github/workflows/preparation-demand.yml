name: One declared preparation attribution process
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  sequence:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Download only the frozen qualified portable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '12619403556'
          run-id: '40247195315'
          github-token: ${{ github.token }}
          path: build/published-player
          merge-multiple: true
      - name: Verify exact declaration, source, candidate and four saved controls
        run: python tools/qa/preparation_demand_ci.py prepare
      - name: Publish the verified identity for the permanent run assignment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cairn-preparation-assignment-request-${{ github.sha }}
          path: reports/preparation-demand-pilot/preflight.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify the permanent assignment to this sole run
        env:
          CAIRN_RESERVATION_READ_TOKEN: ${{ github.token }}
        run: python tools/qa/preparation_demand_ci.py reserve
      - name: Run the one release process; retain every failure without retry
        run: python tools/qa/preparation_demand_ci.py run
      - name: Independently audit all retained files and the finite result
        if: ${{ always() }}
        run: python tools/qa/preparation_demand_ci.py audit
      - name: Preserve original raw evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cairn-preparation-demand-${{ github.sha }}
          path: reports/preparation-demand-pilot/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  saved-recheck:
    needs: sequence
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '12619403556'
          run-id: '40247195315'
          github-token: ${{ github.token }}
          path: build/published-player
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Cairn-preparation-demand-${{ github.sha }}
          path: build/downloaded-preparation-pilot
      - name: Reproduce all saved evidence without another engine
        run: python tools/qa/preparation_demand_saved_recheck.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: Cairn-preparation-demand-recheck-${{ github.sha }}
          path: reports/preparation-demand-downloaded-recheck.json
          if-no-files-found: error
          retention-days: 30
